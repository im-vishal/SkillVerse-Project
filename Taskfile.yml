version: '3'

vars:
  CLUSTER: skillverse
  NAMESPACE: skillverse
  BACKEND_IMAGE: virtualvishal/skillverse-backend:latest
  FRONTEND_IMAGE: virtualvishal/skillverse-frontend:latest

tasks:

  up:
    desc: "Build images, create cluster, load images, apply manifests"
    cmds:
      # - task: build
      - kind create cluster --config k8s/kind-config.yml --name {{.CLUSTER}}
      # - task: load
      - task: apply
      - echo
      - echo "Skillverse is live at http://localhost:8888"
      - echo

  build:
    desc: "Build backend and frontend images"
    cmds:
      - docker build -t {{.BACKEND_IMAGE}} ./backend
      - docker build -t {{.FRONTEND_IMAGE}} ./frontend

  # load:
  #   desc: "Load built images into the Kind cluster"
  #   cmds:
  #     - kind load docker-image {{.BACKEND_IMAGE}} --name {{.CLUSTER}}
  #     - kind load docker-image {{.FRONTEND_IMAGE}} --name {{.CLUSTER}}

  apply:
    desc: "Apply Kubernetes manifests and wait for rollouts"
    cmds:
      - kubectl apply
        -f k8s/00-namespace.yml
        -f k8s/10-mysql.yml
        -f k8s/20-backend.yml
        -f k8s/30-frontend.yml
      - kubectl rollout status statefulset/mysql -n {{.NAMESPACE}} --timeout=180s
      - kubectl rollout status deployment/backend -n {{.NAMESPACE}} --timeout=120s
      - kubectl rollout status deployment/frontend -n {{.NAMESPACE}} --timeout=60s

  down:
    desc: "Delete the Kind cluster"
    cmds:
      - kind delete cluster --name {{.CLUSTER}}

  status:
    desc: "Show Pods, Services and Endpoints"
    cmds:
      - kubectl get pods,svc,endpoints -n {{.NAMESPACE}}

  logs:
    desc: "Tail logs from MySQL, backend and frontend"
    cmds:
      - kubectl logs -n {{.NAMESPACE}} -l 'app in (mysql,backend,frontend)' --all-containers --tail=50 -f --max-log-requests=10

  mysql:
    desc: "Open a MySQL shell in the MySQL Pod"
    cmds:
      - kubectl exec -it -n {{.NAMESPACE}} mysql-0 -- mysql -uskillverse -pskillverse123 skillverse

  restart:
    desc: "Rebuild and reload images, then restart backend and frontend"
    cmds:
      - task: build
      - task: load
      - kubectl rollout restart deployment/backend deployment/frontend -n {{.NAMESPACE}}
      - kubectl rollout status deployment/backend -n {{.NAMESPACE}} --timeout=120s
      - kubectl rollout status deployment/frontend -n {{.NAMESPACE}} --timeout=60s

